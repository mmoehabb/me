<extend template="base.shtml">
<head id="head">
</head>
<main id="main">
	<section class="cover">
		<p class="cover-meta rise rise-1">
			<span class="stamp-inline">Issue <span :text="$site.custom.get('issue')"></span></span>
			<span class="cover-sep" aria-hidden="true">✳</span>
			<span :text="$build.generated.format('January 2006')"></span>
		</p>
		<h1 class="cover-name rise rise-2">
			<span class="cover-name-block" :text="$site.custom.get('name')"></span>
		</h1>
		<p class="cover-tagline rise rise-3" :text="$site.custom.get('tagline')"></p>
		<!-- <p class="stamp rise rise-4">Available for commissions</p> -->
	</section>

	<!-- <div class="ticker bleed rise rise-4"> -->
	<!-- 	<div class="ticker-track"> -->
	<!-- 		<span>Open for commissions ✶ Small web, hand-set ✶ Rust in the browser ✶ Risograph forever ✶&nbsp;</span> -->
	<!-- 		<span>Open for commissions ✶ Small web, hand-set ✶ Rust in the browser ✶ Risograph forever ✶&nbsp;</span> -->
	<!-- 	</div> -->
	<!-- </div> -->

	<section class="section">
		<div class="section-head">
			<h2>Selected Works</h2>
			<span class="count" :text="$site.page('projects').leaves().len.str().suffix(' on file')"></span>
		</div>
		<div class="work-list">
			<ctx :loop="$site.page('projects').subpagesByTag('featured')">
				<div>
					<a class="work-row" href="$loop.it.link()">
						<span class="num" :text="$loop.idx.str()"></span>
						<div class="work-main">
							<h3 :text="$loop.it.title"></h3>
							<p :text="$loop.it.description"></p>
						</div>
						<span class="work-meta">
							<span class="work-year" :text="$loop.it.custom.get('year')"></span>
							<span class="arrow" aria-hidden="true">→</span>
						</span>
					</a>
				</div>
			</ctx>
		</div>
		<p class="section-more"><a class="cta" href="$site.page('projects').link()">All projects</a></p>
	</section>

	<section class="section">
		<div class="section-head">
			<h2>Dispatches</h2>
			<span class="count"><a href="$site.page('articles').alternative('rss').link()">Feed ↗</a></span>
		</div>
		<div class="dispatch-list">
			<ctx :loop="$site.page('articles').leaves(3)">
				<div class="dispatch">
					<span class="dispatch-date" :text="$loop.it.date.format('02 Jan 2006')"></span>
					<h3 class="dispatch-title"><a href="$loop.it.link()" :text="$loop.it.title"></a></h3>
					<span class="dispatch-time" :text="$loop.it.wordCount().div(200).plus(1).str().suffix(' min')"></span>
				</div>
			</ctx>
		</div>
		<p class="section-more"><a class="cta" href="$site.page('articles').link()">All dispatches</a></p>
	</section>

</main>
