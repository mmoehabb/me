<!DOCTYPE html>
<html lang="en">
	<head id="head">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title :text="$page.title.suffix(' · ', $site.title)"></title>
		<meta name="description" content="$page.description">
		<meta name="author" content="$site.custom.get('name')">
		<meta name="theme-color" content="#f4efe3" media="(prefers-color-scheme: light)">
		<meta name="theme-color" content="#1a1611" media="(prefers-color-scheme: dark)">
		<meta property="og:site_name" content="$site.title">
		<meta property="og:type" content="website">
		<meta property="og:title" content="$page.title.suffix(' · ', $site.title)">
		<meta property="og:description" content="$page.description">
		<meta property="og:url" content="$site.host_url.addPath($page.link())">
		<meta property="og:image" content="$site.host_url.addPath($site.asset('splash.png').link())">
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="$page.title.suffix(' · ', $site.title)">
		<meta name="twitter:description" content="$page.description">
		<meta name="twitter:image" content="$site.host_url.addPath($site.asset('splash.png').link())">
		<link rel="icon" href="$site.asset('favicon.svg').link()" type="image/svg+xml">
		<script>(function(){try{var t=localStorage.getItem("theme");if(!t){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();</script>
		<link rel="preload" href="$site.asset('fonts/archivo-black.woff2').link()" as="font" type="font/woff2" crossorigin>
		<link rel="preload" href="$site.asset('fonts/archivo-var.woff2').link()" as="font" type="font/woff2" crossorigin>
		<link rel="preload" href="$site.asset('fonts/newsreader-var.woff2').link()" as="font" type="font/woff2" crossorigin>
		<link type="text/css" rel="stylesheet" href="$site.asset('style.css').link()">
		<link type="text/css" rel="stylesheet" href="$site.asset('highlight.css').link()">
		<super>
	</head>
	<body id="body">
		<a class="skip-link" href="#main">Skip to content</a>
		<header class="masthead">
			<a class="brand" href="$site.index().link()">
				<span class="brand-block" aria-hidden="true"></span>
				<span :text="$site.custom.get('name')"></span>
			</a>
			<button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">Menu</button>
			<nav id="primary-nav" aria-label="Primary">
				<a class="$site.index().isCurrent().then('nav-link is-current', 'nav-link')" href="$site.index().link()">Index</a>
				<a class="$page.link().contains('/projects').then('nav-link is-current', 'nav-link')" href="$site.page('projects').link()">Projects</a>
				<a class="$page.link().contains('/articles').then('nav-link is-current', 'nav-link')" href="$site.page('articles').link()">Articles</a>
				<a class="$page.link().contains('/about').then('nav-link is-current', 'nav-link')" href="$site.page('about').link()">About</a>
				<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Dark</span></button>
			</nav>
		</header>
		<main id="main">
			<super>
		</main>
		<footer id="footer">
			<div class="halftone-strip" aria-hidden="true"></div>
			<div class="footer-grid">
				<div>
					<h2 class="footer-label">Colophon</h2>
					<p class="colophon">Set in <em>Archivo</em> &amp; <em>Newsreader</em>.
						Ink: risograph pink &amp; federal blue.
						Printed on the web with <a href="https://zine-ssg.io">Zine</a>.</p>
				</div>
				<div>
					<h2 class="footer-label">Elsewhere</h2>
					<ul class="footer-links">
						<li><a :if="$site.custom.get('github').len().gt(0)" href="$site.custom.get('github')">GitHub</a></li>
						<li><a :if="$site.custom.get('mastodon').len().gt(0)" href="$site.custom.get('mastodon')">Mastodon</a></li>
						<li><a :if="$site.custom.get('linkedin').len().gt(0)" href="$site.custom.get('linkedin')">LinkedIn</a></li>
						<li><a :if="$site.custom.get('email').len().gt(0)" href="mailto:$site.custom.get('email')">Email</a></li>
					</ul>
				</div>
			</div>
			<p class="footer-fine">
				© <span :text="$build.generated.format('2006')"></span> <span :text="$site.custom.get('name')"></span> — hand-set on the small web.
			</p>
		</footer>
		<script>(function(){var btn=document.getElementById("theme-toggle");if(!btn){return;}function paint(){var dark=document.documentElement.getAttribute("data-theme")==="dark";var icon=btn.querySelector(".theme-icon");var label=btn.querySelector(".theme-label");btn.setAttribute("aria-pressed",dark?"true":"false");btn.setAttribute("aria-label",dark?"Switch to light mode":"Switch to dark mode");if(icon){icon.textContent=dark?"☀":"☾";}if(label){label.textContent=dark?"Light":"Dark";}}btn.addEventListener("click",function(){var next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);try{localStorage.setItem("theme",next);}catch(e){}paint();});paint();})();</script>
		<script>(function(){var btn=document.getElementById("nav-toggle");var masthead=document.querySelector(".masthead");if(!btn||!masthead){return;}function close(){masthead.classList.remove("is-open");btn.setAttribute("aria-expanded","false");btn.setAttribute("aria-label","Open menu");btn.textContent="Menu";}function open(){masthead.classList.add("is-open");btn.setAttribute("aria-expanded","true");btn.setAttribute("aria-label","Close menu");btn.textContent="Close";}btn.addEventListener("click",function(){masthead.classList.contains("is-open")?close():open();});masthead.querySelectorAll("nav a").forEach(function(a){a.addEventListener("click",close);});document.addEventListener("keydown",function(e){if(e.key==="Escape"){close();}});})();</script>
	</body>
</html>
