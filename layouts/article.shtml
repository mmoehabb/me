<extend template="base.shtml">
<head id="head">
</head>
<main id="main">
	<div class="reading-progress" aria-hidden="true">
		<div class="reading-progress-fill" id="reading-progress-fill"></div>
	</div>
	<article class="rise">
		<header class="article-header">
			<p class="kicker"><a href="$site.page('articles').link()">Dispatches</a></p>
			<h1 class="article-title" :text="$page.title"></h1>
		</header>
		<div class="editorial-grid">
			<aside class="toc-rail" id="toc-rail" aria-label="Table of contents" hidden>
				<details class="toc-details" id="toc-details" open>
					<summary class="toc-heading">On this page</summary>
					<nav aria-label="Table of contents">
						<ol class="toc-list" id="toc-list"></ol>
					</nav>
				</details>
			</aside>
			<div class="editorial-body">
				<p class="article-lead" :if="$page.description.len().gt(0)" :text="$page.description"></p>
				<div class="prose" :html="$page.content()"></div>
				<ctx :if="$page.footnotes?()">
					<section class="footnotes">
						<h2 class="footnotes-title">Footnotes</h2>
						<ol :loop="$if">
							<li id="$loop.it.def_id">
								<span :html="$loop.it.html()"></span>
								<ctx :loop="$loop.it.ref_ids">
									<a class="fn-back" href="$loop.it.prefix('#')" :text="$loop.idx.str()"></a>
								</ctx>
							</li>
						</ol>
					</section>
				</ctx>
				<nav class="prev-next" aria-label="More dispatches">
					<div :if="$page.prevPage?()">
						<a href="$if.link()">
							<span class="pn-label">← Older</span>
							<span class="pn-title" :text="$if.title"></span>
						</a>
					</div>
					<div :if="$page.nextPage?()">
						<a href="$if.link()">
							<span class="pn-label">Newer →</span>
							<span class="pn-title" :text="$if.title"></span>
						</a>
					</div>
				</nav>
			</div>
			<aside class="meta-rail" aria-label="Article details">
				<dl class="meta-list">
					<div class="meta-row">
						<dt>Published</dt>
						<dd :text="$page.date.format('Jan 02, 2006')"></dd>
					</div>
					<div class="meta-row">
						<dt>Reading</dt>
						<dd :text="$page.wordCount().div(200).plus(1).str().suffix(' min read')"></dd>
					</div>
					<div class="meta-row" :if="$page.tags.empty.not()">
						<dt>Topics</dt>
						<dd class="meta-topics">
							<ctx :loop="$page.tags"><span :text="$loop.it"></span></ctx>
						</dd>
					</div>
				</dl>
			</aside>
		</div>
	</article>
	<script>(function(){
		var fill=document.getElementById("reading-progress-fill");
		var prose=document.querySelector(".prose");
		var tocRail=document.getElementById("toc-rail");
		var tocDetails=document.getElementById("toc-details");
		var tocList=document.getElementById("toc-list");
		var tocItems=[];
		var mobileMq=window.matchMedia("(max-width: 1040px)");

		if(prose && tocRail && tocDetails && tocList){
			var headings=Array.prototype.slice.call(prose.querySelectorAll("h2, h3"));
			if(headings.length>=2){
				tocRail.hidden=false;
				if(mobileMq.matches){
					tocDetails.removeAttribute("open");
				}
				var usedIds={};
				headings.forEach(function(h){
					if(h.id){ usedIds[h.id]=true; }
				});
				headings.forEach(function(h){
					var id=h.id;
					if(!id){
						var base=(h.textContent||"section").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"section";
						id=base;
						var n=2;
						while(usedIds[id] || document.getElementById(id)){
							id=base+"-"+n;
							n++;
						}
						h.id=id;
					}
					usedIds[id]=true;

					var li=document.createElement("li");
					li.className="toc-item "+(h.tagName==="H3"?"toc-h3":"toc-h2");
					var a=document.createElement("a");
					a.href="#"+id;
					a.textContent=h.textContent;
					a.addEventListener("click",function(){
						if(mobileMq.matches){
							tocDetails.removeAttribute("open");
						}
					});
					li.appendChild(a);
					tocList.appendChild(li);
					tocItems.push({heading:h,link:a});
				});
			}
		}

		var ticking=false;
		function update(){
			ticking=false;
			if(fill){
				var end=0;
				if(prose){
					var rect=prose.getBoundingClientRect();
					end=rect.bottom+window.scrollY-window.innerHeight;
				}
				if(end<=0){
					end=document.documentElement.scrollHeight-window.innerHeight;
				}
				var p=end>0?Math.min(1,Math.max(0,window.scrollY/end)):1;
				fill.style.transform="scaleX("+p.toFixed(4)+")";
			}

			if(tocItems.length){
				var active=tocItems[0];
				if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4){
					active=tocItems[tocItems.length-1];
				}else{
					for(var i=0;i<tocItems.length;i++){
						if(tocItems[i].heading.getBoundingClientRect().top<=110){
							active=tocItems[i];
						}else{
							break;
						}
					}
				}
				for(var j=0;j<tocItems.length;j++){
					var isCur=tocItems[j]===active;
					tocItems[j].link.classList.toggle("is-active",isCur);
					if(isCur){
						tocItems[j].link.setAttribute("aria-current","location");
					}else{
						tocItems[j].link.removeAttribute("aria-current");
					}
				}
				if(active && tocRail && !mobileMq.matches){
					var lr=active.link.getBoundingClientRect();
					var rr=tocRail.getBoundingClientRect();
					if(lr.top<rr.top+24 || lr.bottom>rr.bottom-24){
						active.link.scrollIntoView({block:"nearest"});
					}
				}
			}
		}

		function onScroll(){
			if(!ticking){
				ticking=true;
				window.requestAnimationFrame(update);
			}
		}

		window.addEventListener("scroll",onScroll,{passive:true});
		window.addEventListener("resize",onScroll,{passive:true});
		update();
	})();</script>
</main>
